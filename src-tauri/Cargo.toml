[package]
name = "quick_translate_lib"
version = "0.1.0"
description = "Quick Translate desktop application"
authors = ["Quick Translate"]
edition = "2021"

[lib]
name = "quick_translate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "quick-translate"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
