[package]
name = "quick_translate_lib"
version = "0.1.0"
description = "Quick Translate desktop application"
authors = ["Quick Translate"]
edition = "2021"

[lib]
name = "quick_translate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "quick-translate"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
thiserror = "2"
url = { version = "2", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
